[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://falafelinhotpot.com"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/newsletter"
  to = "/subscribe"
  status = 301

[[redirects]]
  from = "/newsletter/archive"
  to = "/editions"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/editions"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/editions/:splat"
  status = 301

[[redirects]]
  from = "/archive"
  to = "/editions"
  status = 301

[[redirects]]
  from = "/archive/*"
  to = "/editions/:splat"
  status = 301

[[redirects]]
  from = "/mandarin-starterkit-course"
  to = "/mandarin-starterkit-course/"
  status = 301

[[redirects]]
  from = "/courses/7-day-mandarin"
  to = "/mandarin-starterkit-course/"
  status = 301

[[redirects]]
  from = "/links"
  to = "/"
  status = 301
